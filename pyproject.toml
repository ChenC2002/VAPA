[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vapa-ehr"
version = "0.3.0"
description = "Verifier-Anchored Process Advantage for bounded-memory EHR agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anonymous authors" }]
keywords = ["ehr", "llm-agents", "reinforcement-learning", "credit-assignment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
train = [
  "accelerate>=1.2",
  "numpy>=1.26",
  "Pillow>=10.4",
  "peft>=0.20",
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=5.13",
]
# Preparation and statistical analysis use the standard library.
data = []
eval = []
dev = ["build>=1.2", "hatchling>=1.27", "pytest>=8.3", "pytest-cov>=6", "ruff>=0.9"]
all = ["vapa-ehr[train,dev]"]

[project.scripts]
vapa = "vapa.cli:main"
vapa-analyze = "vapa.evaluation.analysis:main"
vapa-report = "vapa.evaluation.reporting:main"
vapa-generate-sft = "vapa.training.demonstrations:main"
vapa-train = "vapa.training.rl_train:main"
vapa-train-sft = "vapa.training.sft_train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vapa"]

[tool.hatch.build.targets.sdist]
only-include = [
  "README.md",
  "pyproject.toml",
  ".gitignore",
  "configs",
  "examples",
  "scripts",
  "src/vapa",
  "tests",
  "results/demo_results.json",
  "results/paper_results.json",
  "results/training_results.json",
  "logs/demo_results.jsonl",
  "logs/paper_results.jsonl",
  "logs/training_results.jsonl",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["model: optional real CPU model training integration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Preserve the public str/Enum representation; StrEnum changes __str__ semantics.
ignore = ["UP042"]
